<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor · Legency Presentaciones</title><link rel="stylesheet" href="src/slide.css"><link rel="stylesheet" href="src/editor.css"></head>
<body><header><strong>LEGENCY®</strong><span>Presentaciones / Editor</span><a href="./?preview=1">Ver cambios ↗</a></header>
<main><aside><h1>Diapositivas <small id="count"></small></h1><nav id="slides"></nav></aside>
<section class="work"><div class="top"><div><small id="slide-no"></small><h2 id="slide-name"></h2></div><div class="actions"><button id="up" title="Subir esta diapositiva">↑</button><button id="down" title="Bajar esta diapositiva">↓</button><button id="duplicate">Duplicar</button><button id="remove">Quitar</button><button id="undo">Deshacer</button><button id="export">Exportar cambios</button><label class="button">Importar cambios<input id="import" type="file" accept="application/json" hidden></label></div></div><div id="canvas"></div><p class="hint">Selecciona un elemento en el lienzo para editarlo. Los cambios se guardan en este navegador; exporta una copia para compartirlos.</p></section>
<aside class="inspector"><h2>Inspector</h2><div id="fields"><p>Selecciona un texto o una imagen.</p></div><hr><details><summary>Estilo general</summary><div id="theme-fields"></div></details><details><summary>Biblioteca de medios</summary><div id="library"></div></details></aside></main>
<script type="module" src="src/editor.js"></script></body></html>
